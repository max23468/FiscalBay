[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscalbay"
version = "1.14.0"
description = "CLI e bot Telegram per leggere identificativi fiscali dagli ordini eBay (API ufficiali)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "FiscalBay" }]
dependencies = [
  "cryptography>=50.0.0",
  "defusedxml>=0.7.1",
]

[project.scripts]
fiscalbay = "fiscalbay.cli:main"
fiscalbay-bot = "fiscalbay.bot:run_bot"
fiscalbay-oauth-server = "fiscalbay.oauth_server:main"
fiscalbay-fix-git-lock = "fiscalbay.git_utils:main"
fiscalbay-git-safe = "fiscalbay.git_utils:safe_git_main"
fiscalbay-healthcheck = "fiscalbay.healthcheck:main"
fiscalbay-reconcile = "fiscalbay.reconcile:main"
fiscalbay-fiscal-export = "fiscalbay.fiscal_export:main"
fiscalbay-scale-check = "fiscalbay.scale_readiness:main"
fiscalbay-security-check = "fiscalbay.security_ops:main"
fiscalbay-support-snapshot = "fiscalbay.support_snapshot:main"

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "coverage>=7.15.3",
  "mypy>=2.3.0",
  "ruff==0.16.1",
]

[tool.setuptools.package-dir]
"" = "src"


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]

[tool.mypy]
python_version = "3.13"
files = ["src/fiscalbay"]
strict = true

[tool.coverage.run]
source = ["src/fiscalbay"]

[tool.coverage.report]
fail_under = 85
show_missing = true
