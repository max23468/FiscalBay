name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.detect.outputs.gate == 'full' }}
      e2e: ${{ steps.detect.outputs.e2e }}
      artifact: build-${{ steps.tree.outputs.tree }}
      artifact-run: ${{ steps.reuse.outputs.run-id || github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `main` riceve soltanto la promozione di `develop` dallo stesso repository.
      - name: Check promotion source
        if: github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${REPOSITORY}" ] || [ "${HEAD_REF}" != "develop" ]; then
            echo "::error::Le PR verso main partono soltanto da develop di ${REPOSITORY}, non da ${HEAD_REPO}:${HEAD_REF}."
            exit 1
          fi

      # Una run annullata da un push successivo non arriva al deploy: il push confronta
      # quindi l'ultimo commit distribuito sul test, non il commit precedente.
      - name: Find last test deploy
        id: deployed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=develop&status=success&per_page=30" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          while read -r run_id sha; do
            [ -n "${run_id}" ] || continue
            deployed="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs" --jq '.jobs[] | select(.name == "Deploy test" and .conclusion == "success") | .name')"
            if [ -n "${deployed}" ] && git merge-base --is-ancestor "${sha}" HEAD; then
              echo "Ultimo deploy test: ${sha} (run ${run_id})."
              echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done <<< "${runs}"
          echo "Nessun deploy test recente: gate completo."

      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.deployed.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output

      - name: Identify tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      # Un tree già verificato da una PR di questo repository non ripete il gate:
      # il deploy distribuisce l'artefatto prodotto da quella verifica.
      - name: Find verified artifact
        id: reuse
        if: github.event_name == 'push' && steps.detect.outputs.gate == 'full'
        env:
          ARTIFACT: build-${{ steps.tree.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          candidates="$(gh api "repos/${REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=20" --jq \
            ".artifacts[] | select(.expired == false and .workflow_run.repository_id == ${REPOSITORY_ID} and .workflow_run.head_repository_id == ${REPOSITORY_ID}) | .workflow_run.id")"
          for run_id in ${candidates}; do
            run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.path + " " + (.conclusion // "")')"
            if [ "${run}" = ".github/workflows/ci.yml success" ]; then
              echo "Tree già verificato dalla run ${run_id}: gate non ripetuto."
              echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "Nessuna verifica riusabile: eseguo il gate completo."

      - name: Set up pnpm
        if: steps.detect.outputs.gate == 'full' && !steps.reuse.outputs.run-id
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Set up Node
        if: steps.detect.outputs.gate == 'full' && !steps.reuse.outputs.run-id
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.gate == 'full' && !steps.reuse.outputs.run-id
        run: pnpm install --frozen-lockfile

      - name: Run local CI gate
        if: steps.detect.outputs.gate == 'full' && !steps.reuse.outputs.run-id
        run: pnpm verify

      - name: Read Playwright version
        id: playwright
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"

      - name: Restore browser cache
        id: browsers
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for interaction tests
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Check browser interactions before deploy
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id
        env:
          E2E_PREBUILT: "1"
        run: pnpm test:e2e

      - name: Upload verified build
        if: steps.detect.outputs.gate == 'full' && !steps.reuse.outputs.run-id
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ steps.tree.outputs.tree }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Check docs-only changes
        if: steps.detect.outputs.gate == 'docs'
        run: |
          node scripts/verify-copy.mjs
          node scripts/verify-docs.mjs

  deploy-test:
    name: Deploy test
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.TEST_DEPLOY_ENABLED == 'true' && needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm

      # L'applicazione non viene ricompilata; Wrangler distribuisce la build verificata.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: build/
          run-id: ${{ needs.verify.outputs.artifact-run }}
          github-token: ${{ github.token }}

      - name: Check commit still on develop
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/develop | cut -f1)"
          test "${current_sha}" = "${VERIFIED_SHA}"

      - name: Read deployed version
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version="$(pnpm exec wrangler deployments status --name fiscalbay-test --json | jq -r '.versions[] | select(.percentage == 100) | .version_id')"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Deploy verified artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config build/server/wrangler.json --strict

      - name: Check test endpoint
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null https://test.fiscalbay.it/

      - name: Read Playwright version
        id: playwright
        if: needs.verify.outputs.e2e == 'true'
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"

      - name: Restore browser cache
        id: browsers
        if: needs.verify.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for interaction tests
        if: needs.verify.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: needs.verify.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # L'account di collaudo torna a uno stato noto prima delle prove autenticate. Se il
      # ripristino non riesce (permessi del token, D1 non raggiungibile) le prove autenticate
      # vengono saltate con un avviso: il deploy non torna indietro per un problema del dato.
      - name: Reset test account
        id: account
        if: needs.verify.outputs.e2e == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: node scripts/reset-test-account.mjs

      - name: Report test account warning
        if: needs.verify.outputs.e2e == 'true' && steps.account.outcome == 'failure'
        run: echo "::warning::Account di collaudo non ripristinato, prove autenticate saltate."

      - name: Check deployed browser interactions
        if: needs.verify.outputs.e2e == 'true'
        env:
          E2E_ACCOUNT_PASSWORD: ${{ steps.account.outcome == 'success' && secrets.E2E_ACCOUNT_PASSWORD || '' }}
        run: pnpm test:e2e:smoke

      # Misura e ricevuta senza bloccare (D148): il p95 oscilla di qualche ms fra misure
      # della stessa versione, quindi oltre soglia resta un avviso e non un rollback.
      - name: Check capacity
        id: capacity
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:capacity --url https://test.fiscalbay.it --worker fiscalbay-test

      - name: Report capacity warning
        if: steps.capacity.outcome == 'failure'
        run: echo "::warning::Controllo di capacità non superato, deploy mantenuto. Ricevuta nel riepilogo della run."

      # Un deploy con endpoint o interazioni falliti non resta distribuito sul test.
      - name: Roll back test deploy
        if: failure() && steps.previous.outputs.version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          pnpm exec wrangler rollback "${PREVIOUS_VERSION}" --name fiscalbay-test --message "Controlli del deploy test non superati" --yes
          echo "Ripristinata la versione ${PREVIOUS_VERSION}." >> "${GITHUB_STEP_SUMMARY}"
