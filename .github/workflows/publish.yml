name: Promuovi

# Avviato su `main` da `release:cycle promote`, dopo che `main` è avanzato in fast-forward sulla
# testa di `develop` già qualificata.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo del candidato su main
        type: string
        required: true
      version:
        description: Versione 2.x in cima al changelog
        type: string
        required: true
      day:
        description: Giorno italiano della pubblicazione (AAAA-MM-GG)
        type: string
        required: true
      reviewed_migrations:
        description: Digest delle migration non additive, ricavato dalle PR del lotto
        type: string
        required: false
      urgente:
        description: Usa soltanto una certificazione già valida sul candidato
        type: boolean
        default: false
      requested_at:
        type: string
        required: false
      certified_at:
        type: string
        required: false

# Nessuna telemetria della CLI `cf` dalle esecuzioni automatiche.
env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  plan:
    name: Verifica candidato
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      reviewed: ${{ steps.lot.outputs.reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Check candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      # Il riuso legge versione, approvazioni e certificazione prima di ogni job costoso.
      - name: Check lot
        id: lot
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
          REVIEWED: ${{ inputs.reviewed_migrations }}
        run: node scripts/release/release-cycle.mjs preflight --sha "${EXPECTED_SHA}" --version "${VERSION}" --reviewed-migrations "${REVIEWED}"
      - name: Find certified candidate
        id: certified
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs --candidate --inherited
      - name: Require certified candidate
        if: steps.certified.outputs.run-id == ''
        run: |
          echo "::error::Tree senza certificazione: release:cycle candidate, poi di nuovo promote."
          exit 1

  # La sorgente è certificata per tree: si prepara e si prova soltanto la build che si distribuisce.
  qualify:
    name: Qualifica Production
    needs: plan
    uses: ./.github/workflows/qualify.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      scope: production
      day: ${{ inputs.day }}

  publish:
    name: Distribuisci e verifica
    needs: [plan, qualify]
    if: ${{ !cancelled() && needs.qualify.result == 'success' }}
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    outputs:
      rollback-compatible: ${{ steps.deploy.outputs.rollback-compatible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.qualify.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ needs.qualify.outputs.artifact-run }}
          github-token: ${{ github.token }}
      - name: Restore receipt from previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/release.mjs restore --environment production --receipt-prefix release-receipt

      # Browser e librerie dall'installer ufficiale di Playwright, prima del deploy: un mirror lento
      # ferma il job senza effetti sul provider, e la ripresa resta possibile.
      - name: Install browsers
        timeout-minutes: 20
        run: pnpm exec playwright install --with-deps chromium webkit

      # La versione arriva al 0% del traffico, salvo una configurazione diversa.
      - name: Deploy or resume confirmed deployment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
          RELEASE_DAY: ${{ inputs.day }}
          RELEASE_REQUESTED_AT: ${{ inputs.requested_at }}
          RELEASE_CERTIFIED_AT: ${{ inputs.certified_at }}
          REVIEWED_MIGRATIONS: ${{ needs.plan.outputs.reviewed }}
        run: node scripts/release/release.mjs deploy --environment production --expected-sha "${EXPECTED_SHA}" --reviewed-migrations "${REVIEWED_MIGRATIONS}"
      - name: Check staged version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release.mjs staged-check --environment production --expected-sha "${EXPECTED_SHA}"
      # Ogni pagina una volta in due browser, sul dominio reale e prima del traffico: il resto è
      # già certificato sul tree, e questa build differisce soltanto per il giorno.
      - name: Check Production public pages and preview exclusion
        env:
          E2E_BASE_URL: https://fiscalbay.it
          E2E_RUN_ID: production-remote
          E2E_PRODUCTION: "1"
          E2E_MATRIX: single
          E2E_VERSION_OVERRIDE: ${{ steps.deploy.outputs.override }}
          E2E_EXPECTED_VERSION: ${{ steps.deploy.outputs.version }}
          VITE_RELEASE_DAY: ${{ inputs.day }}
        run: node scripts/browser-tests.mjs --pages --browsers chromium,webkit
      - name: Activate tested version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release.mjs activate --environment production --expected-sha "${EXPECTED_SHA}"
      - name: Rollback compatible deployment
        if: failure() && steps.deploy.conclusion != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release.mjs rollback --environment production --expected-sha "${EXPECTED_SHA}"
      - name: Create immutable tag and release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release-notes.mjs "${VERSION}" --publish "${EXPECTED_SHA}"
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/release.json
            test-results/browser/
          retention-days: 30

  # La build porta già il giorno: `develop` lo riceve dopo la pubblicazione, così il tree promosso
  # resta quello qualificato. L'app è l'unica eccezione alla protezione di `develop`.
  day:
    name: Giorno della versione
    needs: publish
    environment: develop-alignment
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ALIGNMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALIGNMENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # Con il giorno, i frammenti di `changes/` del commit pubblicato entrano nel changelog e nel
      # registro delle decisioni; quelli arrivati dopo restano al lotto seguente.
      - name: Write the day on develop
        env:
          VERSION: ${{ inputs.version }}
          DAY: ${{ inputs.day }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git fetch --quiet --depth=1 origin "${EXPECTED_SHA}"
          for attempt in 1 2 3; do
            git fetch --quiet --depth=1 origin develop
            git reset --quiet --hard FETCH_HEAD
            node scripts/release/release.mjs date --version "${VERSION}" --day "${DAY}" --sha "${EXPECTED_SHA}"
            if git diff --quiet; then echo "Il changelog porta già il giorno."; exit 0; fi
            git commit --quiet -am "chore: giorno della ${VERSION}"
            if git push --quiet origin HEAD:refs/heads/develop; then exit 0; fi
            sleep "$((attempt * 10))"
          done
          echo "::error::Giorno non scritto: ripetere il job."
          exit 1

  finalize:
    name: Conferma pubblicazione attiva
    needs: [publish, day]
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Restore publication state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release.mjs restore-state --environment production --expected-sha "${EXPECTED_SHA}"
      - name: Confirm expected version after day
        id: state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/release.mjs finalize --environment production --expected-sha "${EXPECTED_SHA}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-state-${{ steps.state.outputs.version }}
          overwrite: true
          path: reports/release.json
          if-no-files-found: error
          retention-days: 90
