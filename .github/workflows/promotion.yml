name: Riallinea develop

on:
  push:
    branches: [main]
  # Ripresa di un riallineamento interrotto: rilegge l'ultima promozione su `main`.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: align-develop
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # La chiave dell'app sta nell'environment, che ammette soltanto `main`.
    environment: develop-alignment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      # La protezione di `develop` non ammette il token del workflow: l'unica eccezione è
      # l'app dedicata, con un token che vale soltanto per questa run.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ALIGNMENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALIGNMENT_APP_PRIVATE_KEY }}
      # La promozione squash ha l'albero di un commit già in `develop`: il merge con la storia di
      # `main` conserva l'albero di `develop`, quindi non può andare in conflitto né cambiare
      # ciò che `Node 26` ha già provato su `develop`.
      - name: Merge promotion history into develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main develop
          promoted="$(git rev-parse origin/main)"
          develop="$(git rev-parse origin/develop)"
          if git merge-base --is-ancestor "${promoted}" "${develop}"; then
            echo "develop contiene già ${promoted}."
            exit 0
          fi
          pr="$(gh api "repos/${GH_REPO}/commits/${promoted}/pulls" --jq 'map(select(.merged_at != null and .base.ref == "main" and .head.ref == "develop" and .head.repo.full_name == .base.repo.full_name))[0]')"
          head="$(jq -r '.head.sha // empty' <<< "${pr}")"
          test -n "${head}" || { echo "::error::${promoted} non è una promozione da develop."; exit 1; }
          git merge-base --is-ancestor "${head}" "${develop}" ||
            { echo "::error::La testa promossa ${head} non è in develop."; exit 1; }
          test "$(git rev-parse "${promoted}^{tree}")" = "$(git rev-parse "${head}^{tree}")" ||
            { echo "::error::L'albero di main non è quello della testa promossa ${head}."; exit 1; }
          merged="$(GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=github-actions@users.noreply.github.com \
            GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=github-actions@users.noreply.github.com \
            git commit-tree "${develop}^{tree}" -p "${develop}" -p "${promoted}" \
            -m 'chore: riallinea la storia di promozione')"
          # Fast-forward senza forzature: se develop è avanzato nel frattempo, il push fallisce
          # e la run si riprende con l'avvio manuale.
          git push --quiet "https://x-access-token:${APP_TOKEN}@github.com/${GH_REPO}.git" \
            "${merged}:refs/heads/develop"
          echo "develop avanzato a ${merged}, con la storia di ${promoted} e lo stesso albero."
