name: Ciclo

# `Pubblica` e `Promuovi` girano qui: chiudere la sessione o spegnere il Mac non li ferma. Il titolo
# della run lega il comando locale alla run da seguire.
run-name: Ciclo ${{ inputs.operation }} ${{ inputs.object }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: pr, production, promote, rollback oppure resume
        type: choice
        options: [pr, production, promote, rollback, resume]
        required: true
      object:
        description: Numero della PR, versione, lotto oppure run da riprendere
        type: string
        required: true
      environment:
        description: Ambiente della run da riprendere
        type: choice
        options: [production, test]
        default: production
      urgente:
        type: boolean
        default: false
      reviewed_migrations:
        type: string
        required: false
      sha:
        description: Commit esatto autorizzato dal comando locale
        type: string
        required: true
      requested_at:
        type: string
        required: true
      runner:
        description: mac quando un runner del Mac dell'owner è libero, altrimenti github
        type: choice
        options: [github, mac]
        default: github

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read

# Ogni PR ha il proprio ciclo: le PR si mettono in fila soltanto per il merge, con il blocco fra
# runner del coordinatore. Promozioni e riprese Production restano una alla volta, senza fermare
# le PR verso il test; la ripresa di una run del test o di una qualifica ha un gruppo proprio. Il
# ritiro non aspetta un ciclo in corso: `rollback.yml` condivide il gruppo con `publish.yml`.
# Un coordinatore passa quasi tutto il tempo ad aspettare altre run: sul runner del Mac non toglie
# posti alle Actions dell'account. Esegue soltanto codice di `develop` senza installare dipendenze;
# con il Mac spento o i suoi runner occupati il comando locale sceglie le Actions.
jobs:
  cycle:
    name: Coordinatore
    if: inputs.operation != 'production'
    runs-on: ${{ inputs.runner == 'mac' && fromJSON('["self-hosted","fiscalbay-coordinator"]') || 'ubuntu-26.04' }}
    timeout-minutes: 240
    concurrency:
      group: publication-cycle-${{ inputs.operation == 'rollback' && 'rollback' || inputs.operation == 'pr' && format('pr-{0}', inputs.object) || inputs.operation == 'resume' && inputs.environment == 'test' && format('run-{0}', inputs.object) || 'release' }}
      cancel-in-progress: false
    # Il token dell'owner: con quello del workflow merge e push non avvierebbero la CI.
    environment: publication
    steps:
      - name: Check branch
        run: test "${GITHUB_REF}" = refs/heads/develop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Run the cycle
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          OBJECT: ${{ inputs.object }}
          URGENTE: ${{ inputs.urgente }}
          REVIEWED: ${{ inputs.reviewed_migrations }}
          EXPECTED_SHA: ${{ inputs.sha }}
          REQUESTED_AT: ${{ inputs.requested_at }}
        run: |
          if [ "${OPERATION}" = pr ]; then
            node scripts/release/release-cycle.mjs pr "${OBJECT}" --sha "${EXPECTED_SHA}"
          elif [ "${OPERATION}" = promote ]; then
            options=(--reviewed-migrations "${REVIEWED}")
            if [ "${OBJECT}" != lotto ]; then options+=(--version "${OBJECT}"); fi
            if [ "${URGENTE}" = true ]; then options+=(--urgente); fi
            node scripts/release/release-cycle.mjs promote --sha "${EXPECTED_SHA}" --requested-at "${REQUESTED_AT}" "${options[@]}"
          elif [ "${OPERATION}" = resume ]; then
            node scripts/release/release-cycle.mjs resume "${OBJECT}" --sha "${EXPECTED_SHA}"
          else
            node scripts/release/release-cycle.mjs rollback --sha "${EXPECTED_SHA}"
          fi

  # Pubblica in Production: il ciclo della PR nel suo gruppo, poi la promozione del commit
  # integrato, con la PR e il lotto già su `develop`, nel gruppo delle promozioni. L'input
  # `urgente` qui non si legge: il comando locale rifiuta `--urgente` con `production`.
  production-pr:
    name: Coordinatore PR
    if: inputs.operation == 'production'
    runs-on: ${{ inputs.runner == 'mac' && fromJSON('["self-hosted","fiscalbay-coordinator"]') || 'ubuntu-26.04' }}
    timeout-minutes: 240
    concurrency:
      group: publication-cycle-pr-${{ inputs.object }}
      cancel-in-progress: false
    environment: publication
    steps:
      - name: Check branch
        run: test "${GITHUB_REF}" = refs/heads/develop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Run the pull request cycle
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          OBJECT: ${{ inputs.object }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: node scripts/release/release-cycle.mjs pr "${OBJECT}" --sha "${EXPECTED_SHA}"

  production-promote:
    name: Coordinatore promozione
    needs: production-pr
    runs-on: ${{ inputs.runner == 'mac' && fromJSON('["self-hosted","fiscalbay-coordinator"]') || 'ubuntu-26.04' }}
    timeout-minutes: 240
    concurrency:
      group: publication-cycle-release
      cancel-in-progress: false
    environment: publication
    steps:
      - name: Check branch
        run: test "${GITHUB_REF}" = refs/heads/develop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_TOKEN }}
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Promote the merged commit
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          OBJECT: ${{ inputs.object }}
          REVIEWED: ${{ inputs.reviewed_migrations }}
          REQUESTED_AT: ${{ inputs.requested_at }}
        run: node scripts/release/release-cycle.mjs promote --pr "${OBJECT}" --requested-at "${REQUESTED_AT}" --reviewed-migrations "${REVIEWED}"
