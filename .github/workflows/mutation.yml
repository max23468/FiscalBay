name: Mutation

on:
  workflow_call:
    inputs:
      targets:
        description: Matrice JSON dei moduli critici da qualificare
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  mutation:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(inputs.targets) }}
    concurrency:
      group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    env:
      MUTATION_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - name: Find verified mutation receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/mutation.mjs --find "${MUTATION_TARGET}"
      - name: Download verified receipt
        if: steps.receipt.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ${{ steps.receipt.outputs.directory }}
          run-id: ${{ steps.receipt.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check receipt inputs and outcome
        if: steps.receipt.outputs.run-id != ''
        run: node scripts/mutation.mjs --check "${MUTATION_TARGET}"
      - name: Restore incremental results
        if: steps.receipt.outputs.run-id == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.receipt.outputs.directory }}/incremental.json
            ${{ steps.receipt.outputs.directory }}/context.json
          key: ${{ steps.receipt.outputs.cache-key }}
          restore-keys: ${{ steps.receipt.outputs.cache-prefix }}
      - name: Install dependencies
        if: steps.receipt.outputs.run-id == ''
        run: pnpm install --frozen-lockfile
      - name: Qualify critical module
        if: steps.receipt.outputs.run-id == ''
        env:
          MUTATION_INCREMENTAL: "1"
        run: pnpm test:mutation "${MUTATION_TARGET}"
      - name: Preserve verified receipt
        if: success() && steps.receipt.outputs.run-id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: |
            ${{ steps.receipt.outputs.directory }}/receipt.json
            ${{ steps.receipt.outputs.directory }}/mutation.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve mutation evidence
        if: always() && steps.receipt.outputs.run-id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt.outputs.cache-key }}
          path: ${{ steps.receipt.outputs.directory }}
          retention-days: 7
