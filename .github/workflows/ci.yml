name: CI

on:
  pull_request:
    # `ready_for_review` riavvia le prove browser saltate mentre la PR era in bozza.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit esatto atteso dopo un merge automatico
        type: string
        required: false
      reviewed_migrations:
        description: Digest delle migration non additive approvate, se presenti
        type: string
        required: false

# Un nuovo push sulla PR annulla l'intera run superata, mutation compresa: i gruppi dei singoli job
# fermavano soltanto il job con lo stesso indice, e due run della stessa PR si contendevano i posti.
# Push e avvii manuali su `develop` hanno un gruppo per run e non si annullano.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nessuna telemetria della CLI `cf` dalle esecuzioni automatiche.
env:
  DO_NOT_TRACK: "1"

# Anche nel container di Playwright, dove la shell predefinita dei passi sarebbe `sh`.
defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read
  # Corpo della PR: approvazione delle migration non additive.
  pull-requests: read

jobs:
  # Classificazione, controlli della PR, build e artefatto: le prove browser partono subito dopo,
  # mentre il gate che comprende la build gira nel job `quality`.
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      base: ${{ steps.deployed.outputs.sha }}
      build: ${{ steps.detect.outputs.build }}
      e2e: ${{ steps.detect.outputs.e2e }}
      grep: ${{ steps.detect.outputs.grep }}
      browsers: ${{ steps.detect.outputs.browsers }}
      matrix: ${{ steps.detect.outputs.matrix }}
      browser-matrix: ${{ steps.browser-plan.outputs.browser-matrix }}
      browser-reused: ${{ steps.browser-plan.outputs.browser-reused }}
      browser-grep: ${{ steps.browser-plan.outputs.browser-grep }}
      mutation-pr: ${{ steps.modules.outputs.matrix || '{"include":[]}' }}
      reused: ${{ steps.reuse.outputs.run-id != '' }}
      artifact: ${{ steps.reuse.outputs.artifact || format('build-{0}', steps.tree.outputs.tree) }}
      artifact-run: ${{ steps.reuse.outputs.run-id || github.run_id }}
      playwright: ${{ steps.tree.outputs.playwright }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      # Una base avanzata nel frattempo basta che non tocchi file della PR o globali: si rilegge
      # al merge, e il push sul branch riesegue il gate sul tree integrato prima del deploy.
      - name: Check final qualification base
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release/release-cycle.mjs qualification-base --base "${BASE_SHA}" --head "${HEAD_SHA}"

      # Sul push il confronto parte dall'ultimo deploy test riuscito, o dalla run verde successiva
      # senza modifiche da distribuire: una run annullata o un deploy fallito restano nel diff.
      - name: Find last test deploy
        id: deployed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/find-deployed.mjs

      # La PR si confronta attraverso il commit di merge provato: una testa che non contiene la
      # base non riporta come proprie le modifiche entrate nel frattempo.
      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.deployed.outputs.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || github.event.after }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output

      - name: Identify tree
        id: tree
        # La versione di Playwright del manifest sceglie l'immagine dei job browser.
        run: |
          {
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "playwright=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')"
          } >> "${GITHUB_OUTPUT}"

      # Un tree già verificato su develop, o dalla PR del merge che non tocca il processo, non
      # ripete il gate: il deploy distribuisce l'artefatto prodotto da quella verifica.
      - name: Find verified artifact
        id: reuse
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.detect.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs

      # I controlli dei documenti non richiedono le dipendenze.
      - name: Set up Node and dependencies
        if: ${{ !steps.reuse.outputs.run-id }}
        uses: ./.github/actions/setup
        with:
          install: ${{ steps.detect.outputs.gate != 'docs' }}

      # Le migration non additive si approvano nella PR, non dopo il merge sul deploy test.
      # Il corpo si rilegge dall'API: una nuova esecuzione vede la riga aggiunta dopo l'apertura.
      - name: Check migration review
        if: github.event_name == 'pull_request' && steps.detect.outputs.gate == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PR_BODY="$(gh api "repos/${REPOSITORY}/pulls/${NUMBER}" --jq '.body // ""')" \
            node scripts/release/release.mjs review --base "${BASE_SHA}"

      # I moduli critici della PR si dividono nelle stesse parti del riferimento di `develop`.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' && steps.detect.outputs.mutation-pr != '{"target":[]}'
        with:
          path: .mutation-timings.json
          key: mutation-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-timings-
      # Con il riferimento completo di `develop` e pochi mutanti da ripetere il modulo resta in un
      # solo job: ogni parte ripeterebbe la prova iniziale della suite.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' && steps.detect.outputs.mutation-pr != '{"target":[]}'
        with:
          path: .mutation-references
          key: mutation-references-${{ github.sha }}
          restore-keys: mutation-references-
      - name: Split module mutation
        id: modules
        if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && steps.detect.outputs.mutation-pr != '{"target":[]}'
        # Un modulo già provato in una run precedente della stessa PR, e non toccato da allora, per
        # esempio dopo un'unione di `develop`, non si ripete; di un modulo provato in parte, anche
        # in run diverse con lo stesso piano, ripartono soltanto le parti mancanti.
        env:
          TARGETS: ${{ steps.detect.outputs.mutation-pr }}
          MUTATION_REFERENCES: .mutation-references
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          MUTATION_PR_BRANCH: ${{ github.head_ref }}
          # Il commit di merge provato: una base avanzata senza unione nel branch conta come cambio.
          HEAD_SHA: ${{ github.sha }}
          MUTATION_PLAN: ${{ runner.temp }}/mutation-plan.json
        run: node scripts/mutation.mjs --matrix "${TARGETS}"

      # Il piano della matrice: le run seguenti della PR vi leggono parti, intervalli e sorgente.
      - name: Preserve mutation plan
        if: steps.modules.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-plan.json
          overwrite: true
          retention-days: 7

      # Una nuova sezione in cima al changelog sale di un solo passo dall'ultima versione pubblicata.
      - name: Check version step
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/release.mjs version-step --base "${BASE_SHA}"

      # Con la build il gate gira nel job `quality`, accanto ai browser: i controlli documentali,
      # pochi secondi, si anticipano qui perché un errore, per esempio una decisione con lo stesso
      # numero di un'altra PR, fermi la run prima di browser e mutation.
      - name: Check documents before browsers
        if: steps.reuse.outputs.run-id == '' && steps.detect.outputs.build == 'true'
        run: pnpm verify:documents

      # Senza build il gate resta qui; con la build gira nel job `quality`.
      - name: Run selected CI gate
        if: steps.reuse.outputs.run-id == '' && steps.detect.outputs.build != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.deployed.outputs.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || github.event.after }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --run

      - name: Preserve coverage report
        if: always() && steps.reuse.outputs.run-id == '' && steps.detect.outputs.build != 'true' && steps.detect.outputs.gate != 'docs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

      # La stessa build test che chiude la sequenza del gate; l'artefatto diventa distribuibile
      # soltanto con `Node 26` verde, che richiede anche il gate.
      - name: Build test artifact
        if: steps.detect.outputs.build == 'true' && !steps.reuse.outputs.run-id
        run: pnpm build

      - name: Size browser jobs from selected inventory
        id: browser-plan
        if: steps.detect.outputs.e2e == 'true' && !steps.reuse.outputs.run-id && github.event.pull_request.draft != true
        # Nella PR le prove già concluse in una run precedente, con lo stesso inventario, non
        # ripartono senza cambi rilevanti per i browser; dopo un'unione con la base ripartono soltanto
        # le aree toccate sia dai cambi sia dalla PR, con il nucleo `@smoke`.
        env:
          BROWSER_GREP: ${{ steps.detect.outputs.grep }}
          BROWSERS: ${{ steps.detect.outputs.browsers }}
          E2E_MATRIX: ${{ steps.detect.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          BROWSER_PR_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: node scripts/browser-tests.mjs --plan --grep "${BROWSER_GREP}" --browsers "${BROWSERS}"

      - name: Preserve browser inventory
        if: steps.browser-plan.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-plan-${{ github.run_id }}
          path: test-results/browser-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Record build provenance
        if: steps.detect.outputs.build == 'true' && !steps.reuse.outputs.run-id
        run: node scripts/release/release.mjs manifest --environment test

      # Una build riusata dalla PR diventa anche artefatto di questa run su `develop`: la qualifica
      # del candidato e le run successive dello stesso tree la riconoscono come verificata qui.
      - name: Download pull request build
        if: steps.reuse.outputs.source == 'pull'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Republish pull request build
        if: steps.reuse.outputs.source == 'pull'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ steps.tree.outputs.tree }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified build
        if: steps.detect.outputs.build == 'true' && !steps.reuse.outputs.run-id && github.event.pull_request.draft != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ steps.tree.outputs.tree }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Gate scelto dal classificatore quando serve la build, in parallelo alle prove browser.
  quality:
    name: Gate
    needs: verify
    if: needs.verify.outputs.reused != 'true' && needs.verify.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      - name: Run selected CI gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || needs.verify.outputs.base }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || github.event.after }}
          VERIFIED_TEST_BUILD: "true"
        # I browser restano nei rispettivi job; il gate locale usa la stessa sequenza.
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --run

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # Prove browser sulla build verificata, divise su otto macchine con quattro worker ciascuna.
  # L'immagine ufficiale di Playwright contiene browser e librerie di sistema della stessa versione.
  browser:
    name: Browser ${{ matrix.shard }}/${{ matrix.total }}
    needs: verify
    # Una PR in bozza esegue soltanto `Verify`: le prove complete partono quando è pronta.
    if: needs.verify.outputs.e2e == 'true' && needs.verify.outputs.reused != 'true' && needs.verify.outputs.browser-reused != 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.verify.outputs.playwright }}-noble
      options: --ipc=host
    timeout-minutes: 20
    concurrency:
      group: browser-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Venti job contemporanei per l'account: con un tetto per run la coda resta corta e i job
      # brevi di merge, deploy e pubblicazione trovano un posto in pochi minuti.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verify.outputs.browser-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: .cloudflare/output/

      # Una prova che riesce alla ripetizione resta nel report con un avviso; due fallimenti
      # bloccano ancora il gate.
      - name: Check browser interactions before deploy
        env:
          E2E_PREBUILT: "1"
          E2E_RETRIES: "1"
          E2E_MATRIX: ${{ needs.verify.outputs.matrix }}
          # Dopo un'unione con la base, le sole aree toccate sia dai cambi sia dalla PR.
          BROWSER_GREP: ${{ needs.verify.outputs.browser-grep || needs.verify.outputs.grep }}
          BROWSERS: ${{ needs.verify.outputs.browsers }}
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
        run: node scripts/browser-tests.mjs --grep "${BROWSER_GREP}" --browsers "${BROWSERS}" --shard "${SHARD}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Moduli critici cambiati o importati da un test cambiato, per intero e in modo incrementale: un
  # mutante sopravvissuto si corregge nella PR, non alla qualifica del candidato, che riusa questa
  # prova per lo stesso contenuto. I consumatori restano al candidato e alla campagna settimanale.
  mutation-pr:
    name: Mutation ${{ matrix.target }} ${{ matrix.shard }}
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.verify.outputs.mutation-pr != '{"include":[]}'
    runs-on: ubuntu-26.04
    # Senza riferimento una parte prova circa 150 mutanti, dopo la prova iniziale della suite che
    # può durare fino a venti minuti.
    timeout-minutes: 60
    concurrency:
      group: mutation-pr-${{ github.event.pull_request.number }}-${{ strategy.job-index }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      # Venti job contemporanei per l'account: il resto alla qualifica del candidato e alle altre PR.
      max-parallel: 4
      matrix: ${{ fromJSON(needs.verify.outputs.mutation-pr) }}
    env:
      MUTATION_TARGET: ${{ matrix.target }}
      MUTATION_SHARD: ${{ matrix.shard }}
      MUTATION_RANGES: ${{ matrix.ranges }}
      MUTATION_DIGEST: ${{ matrix.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      # Il modulo in un solo job parte dal riferimento completo che ha deciso la matrice.
      - name: Restore complete develop reference
        if: matrix.reference
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-references
          key: mutation-references-${{ github.sha }}
          restore-keys: mutation-references-

      # Il riferimento della stessa parte, salvato su `develop` dall'ultima qualifica o campagna
      # riuscita; con parti diverse quello più recente del modulo, che copre comunque i suoi mutanti.
      - name: Restore develop reference
        if: ${{ !matrix.reference }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-reference
          key: mutation-reference-${{ matrix.target }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            mutation-reference-${{ matrix.target }}-${{ matrix.shard }}-
            mutation-reference-${{ matrix.target }}-

      # La prova più recente della stessa PR su un antenato della testa, preferendo la stessa parte,
      # altrimenti il riferimento: Stryker ripete soltanto i mutanti con codice o test cambiati.
      - name: Restore incremental base
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MUTATION_REFERENCE: ${{ matrix.reference || '.mutation-reference/incremental.json' }}
        run: node scripts/mutation.mjs --incremental-base "${RUNNER_TEMP}/mutation-base.json"

      - name: Qualify critical module
        env:
          MUTATION_INCREMENTAL_BASE: ${{ runner.temp }}/mutation-base.json
        run: pnpm test:mutation "${MUTATION_TARGET}"

      - name: Preserve incremental report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-pr-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # Unico controllo richiesto dalla protezione dei branch: riassume gli esiti dei job.
  gate:
    name: Node 26
    needs: [verify, quality, browser, mutation-pr]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Esiti: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::Almeno un controllo non è riuscito (${result})."
                exit 1
                ;;
            esac
          done

  # L'attesa di `Promuovi` si consuma qui: la qualifica parte dopo ogni merge, e i merge ravvicinati
  # si accorpano nella coda di `candidate-qualification`.
  candidate:
    name: Avvia qualifica
    needs: gate
    # Un job saltato a monte, normale con un diff piccolo, non deve saltare anche questo.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.gate.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start candidate qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: gh workflow run candidate.yml --repo "${GITHUB_REPOSITORY}" --ref develop -f automatic=true -f expected_sha="${SHA}"

  deploy-test:
    name: Deploy test
    needs: [verify, gate]
    # I job browser saltati per il riuso non devono bloccare il deploy.
    # Gli esiti dei due gate restano obbligatori, anche dopo un fallimento o una cancellazione.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.TEST_DEPLOY_ENABLED == 'true' && needs.verify.outputs.deploy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # L'applicazione non viene ricompilata; `cf` distribuisce la build verificata.
      - name: Set up Node and dependencies
        uses: ./.github/actions/setup

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ needs.verify.outputs.artifact-run }}
          github-token: ${{ github.token }}

      - name: Verify artifact provenance
        run: node scripts/release/release.mjs verify --environment test

      # Con un merge già arrivato questo deploy è superato: lo lascia a quello del commit nuovo.
      - name: Check commit still on develop
        id: head
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/develop | cut -f1)"
          if [ "${current_sha}" = "${VERIFIED_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::develop è già su ${current_sha}: il deploy passa alla sua run."
            echo "current=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Restore receipt from previous attempt
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/release.mjs restore --environment test --receipt-prefix deployed

      # La versione arriva al 0% del traffico, salvo una configurazione diversa. Senza un digest nel
      # dispatch vale quello approvato nella PR integrata.
      - name: Deploy verified artifact
        id: deploy
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          PR_BODY="$(gh api "repos/${REPOSITORY}/commits/${VERIFIED_SHA}/pulls" --jq '.[0].body // ""')" \
            node scripts/release/release.mjs deploy --environment test --reviewed-migrations "${REVIEWED_MIGRATIONS}"

      - name: Check staged version
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release/release.mjs staged-check --environment test

      # Il job distribuisce e può tornare indietro: resta sul runner, con il solo Chromium
      # installato dall'installer ufficiale di Playwright. Il collaudo remoto vale per ogni
      # deploy, anche quando il livello del gate non esegue le prove browser della PR.
      - name: Install Chromium
        if: steps.head.outputs.current == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      # L'account di collaudo torna a uno stato noto prima delle prove autenticate. Se il
      # ripristino non riesce (permessi del token, D1 non raggiungibile) le prove autenticate
      # vengono saltate con un avviso: il deploy non torna indietro per un problema del dato.
      - name: Reset test account
        id: account
        if: steps.head.outputs.current == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: node scripts/reset-test-account.mjs

      - name: Report test account warning
        if: steps.account.outcome == 'failure'
        run: echo "::warning::Account di collaudo non ripristinato, prove autenticate saltate."

      - name: Check deployed pages
        if: steps.head.outputs.current == 'true'
        env:
          E2E_RUN_ID: test-pages
          E2E_MATRIX: single
          E2E_BASE_URL: https://test.fiscalbay.it
          E2E_VERSION_OVERRIDE: ${{ steps.deploy.outputs.override }}
          E2E_EXPECTED_VERSION: ${{ steps.deploy.outputs.version }}
          E2E_ACCOUNT_PASSWORD: ${{ steps.account.outcome == 'success' && secrets.E2E_ACCOUNT_PASSWORD || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Le pagine sono già provate sullo stesso artefatto prima del merge: qui si visitano soltanto
        # quelle che provano ambiente, D1, sessione e segreti (@remote).
        # Le invocazioni del Worker restano nell'evidenza, ripulite, per le richieste lente o fallite.
        run: |
          node scripts/watch-invocations.mjs --worker fiscalbay-test \
            --output test-results/browser/invocations.json -- \
            node scripts/browser-tests.mjs --pages --grep "@remote"

      - name: Activate tested version
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release/release.mjs activate --environment test

      - name: Check test endpoint
        if: steps.head.outputs.current == 'true'
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null https://test.fiscalbay.it/

      - name: Check deployed browser interactions
        if: steps.head.outputs.current == 'true'
        env:
          E2E_RUN_ID: test-smoke
          E2E_ACCOUNT_PASSWORD: ${{ steps.account.outcome == 'success' && secrets.E2E_ACCOUNT_PASSWORD || '' }}
        run: pnpm test:e2e:smoke

      # Un deploy con endpoint o interazioni falliti non resta distribuito sul test; una versione
      # caricata e non superata esce dal deployment senza aver visto traffico.
      - name: Roll back test deploy
        if: failure() && steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/release/release.mjs rollback --environment test

      - name: Upload deployed evidence
        if: always() && steps.head.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser/
            reports/release.json
          retention-days: 7

      # Conferma finale nel job, con i segreti e la rete del runner: ricevuta, collaudo remoto
      # e `release:cycle` la legge senza accedere al provider dalla sessione.
      - name: Confirm provider readback
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release/release.mjs confirm --environment test
