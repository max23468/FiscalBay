name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check title
        env:
          PR_TITLE: "${{ github.event.pull_request.title || 'chore: manual title check' }}"
        run: |
          node -e '
            const title = process.env.PR_TITLE.trim();
            if (!/^(feat|fix|perf|docs|test|chore|ci|refactor|build)(\([a-z0-9._-]+\))?!?: .+$/.test(title)) {
              console.error("Invalid PR title: " + title);
              console.error("Use Conventional Commit format, for example feat: add settings command.");
              process.exitCode = 1;
            }
          '
