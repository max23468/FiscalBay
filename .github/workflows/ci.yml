name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node 26
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `main` riceve soltanto la promozione di `develop` dallo stesso repository.
      - name: Check promotion source
        if: github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${REPOSITORY}" ] || [ "${HEAD_REF}" != "develop" ]; then
            echo "::error::Le PR verso main partono soltanto da develop di ${REPOSITORY}, non da ${HEAD_REPO}:${HEAD_REF}."
            exit 1
          fi

      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output

      - name: Set up pnpm
        if: steps.detect.outputs.gate == 'full'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node
        if: steps.detect.outputs.gate == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.gate == 'full'
        run: pnpm install --frozen-lockfile

      - name: Run local CI gate
        if: steps.detect.outputs.gate == 'full'
        run: pnpm verify

      - name: Install browser for interaction tests
        if: steps.detect.outputs.e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Check browser interactions
        if: steps.detect.outputs.e2e == 'true'
        run: pnpm test:e2e --update-snapshots=missing

      - name: Upload visual references
        if: always() && steps.detect.outputs.e2e == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-references
          path: e2e/*-snapshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check docs-only changes
        if: steps.detect.outputs.gate == 'docs'
        run: |
          node scripts/verify-copy.mjs
          node scripts/verify-docs.mjs

  deploy-test:
    name: Deploy test
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.TEST_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test artifact
        run: pnpm build

      - name: Check commit still on develop
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/develop | cut -f1)"
          test "${current_sha}" = "${VERIFIED_SHA}"

      - name: Deploy verified artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config build/server/wrangler.json --strict

      - name: Check test endpoint
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null https://test.fiscalbay.it/
