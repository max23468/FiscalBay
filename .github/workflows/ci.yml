name: CI

on:
  pull_request:
    # `ready_for_review` riavvia le prove browser e mutation saltate mentre la PR era in bozza.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit esatto atteso dopo un merge automatico
        type: string
        required: false
      reviewed_migrations:
        description: Digest delle migration non additive approvate, se presenti
        type: string
        required: false

permissions:
  actions: read
  contents: read

jobs:
  # Gate locale, build e artefatto; prove browser e mutation girano in job propri.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      build: ${{ steps.detect.outputs.build }}
      e2e: ${{ steps.detect.outputs.e2e }}
      grep: ${{ steps.detect.outputs.grep }}
      browsers: ${{ steps.detect.outputs.browsers }}
      mutation: ${{ steps.detect.outputs.mutation }}
      mutation-matrix: ${{ steps.detect.outputs.mutation-matrix }}
      reused: ${{ steps.reuse.outputs.run-id != '' }}
      artifact: build-${{ steps.tree.outputs.tree }}
      artifact-run: ${{ steps.reuse.outputs.run-id || github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `main` riceve soltanto la promozione di `develop` dallo stesso repository.
      - name: Check promotion source
        if: github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${HEAD_REPO}" != "${REPOSITORY}" ] || [ "${HEAD_REF}" != "develop" ]; then
            echo "::error::Le PR verso main partono soltanto da develop di ${REPOSITORY}, non da ${HEAD_REPO}:${HEAD_REF}."
            exit 1
          fi

      - name: Check dispatched commit
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      # Sul push il confronto parte dall'ultimo deploy test riuscito, non dal push precedente:
      # una run annullata da un push successivo o un deploy fallito restano nel diff.
      - name: Find last test deploy
        id: deployed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/find-deployed.mjs

      - name: Classify changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.deployed.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output

      - name: Identify tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"

      # Un tree già verificato da una PR di questo repository non ripete il gate:
      # il deploy distribuisce l'artefatto prodotto da quella verifica.
      - name: Find verified artifact
        id: reuse
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.base_ref == 'main' && steps.detect.outputs.promotion-reuse == 'true')) && steps.detect.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs

      - name: Set up pnpm
        if: steps.detect.outputs.gate != 'docs' && !steps.reuse.outputs.run-id
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node
        if: steps.detect.outputs.gate != 'docs' && !steps.reuse.outputs.run-id
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm

      - name: Install dependencies
        if: steps.detect.outputs.gate != 'docs' && !steps.reuse.outputs.run-id
        run: pnpm install --frozen-lockfile

      - name: Run selected CI gate
        if: steps.reuse.outputs.run-id == ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.deployed.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        # Browser e mutation restano nei rispettivi job; il gate locale usa la stessa sequenza.
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --run --gate-only

      - name: Record build provenance
        if: steps.detect.outputs.build == 'true' && !steps.reuse.outputs.run-id
        run: node scripts/release.mjs manifest --environment test

      - name: Upload verified build
        if: steps.detect.outputs.build == 'true' && !steps.reuse.outputs.run-id && github.event.pull_request.draft != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ steps.tree.outputs.tree }}
          path: build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Prove browser sulla build verificata, divise su quattro macchine con quattro worker ciascuna.
  browser:
    name: Browser ${{ matrix.shard }}/4
    needs: verify
    # Una PR in bozza esegue soltanto `Verify`: le prove complete partono quando è pronta.
    if: needs.verify.outputs.e2e == 'true' && needs.verify.outputs.reused != 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: browser-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: build/

      # `vite preview` trova la configurazione del Worker tramite il rinvio che la build
      # scrive fuori da `build/`; l'artefatto contiene soltanto `build/`.
      - name: Point preview to the build
        run: |
          mkdir -p .wrangler/deploy
          echo '{"configPath":"../../build/server/wrangler.json","auxiliaryWorkers":[]}' > .wrangler/deploy/config.json

      - name: Read Playwright version
        id: playwright
        env:
          BROWSERS: ${{ needs.verify.outputs.browsers }}
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"
          echo "browsers=${BROWSERS//,/-}" >> "${GITHUB_OUTPUT}"

      - name: Restore browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
          restore-keys: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-

      - name: Install browser for interaction tests
        env:
          BROWSERS: ${{ needs.verify.outputs.browsers }}
        run: |
          IFS=, read -ra browsers <<< "${BROWSERS}"
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Check browser interactions before deploy
        env:
          E2E_PREBUILT: "1"
          BROWSER_GREP: ${{ needs.verify.outputs.grep }}
          BROWSERS: ${{ needs.verify.outputs.browsers }}
          SHARD: ${{ matrix.shard }}/4
        run: node scripts/browser-tests.mjs --grep "${BROWSER_GREP}" --browsers "${BROWSERS}" --shard "${SHARD}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Lo stesso workflow mutation serve PR, merge e candidato, con ricevute per input.
  mutation:
    name: Mutation
    needs: verify
    if: needs.verify.outputs.mutation != '' && needs.verify.outputs.reused != 'true' && github.event.pull_request.draft != true
    uses: ./.github/workflows/mutation.yml
    with:
      targets: ${{ needs.verify.outputs.mutation-matrix }}

  # Unico controllo richiesto dalla protezione dei branch: riassume gli esiti dei job.
  gate:
    name: Node 26
    needs: [verify, browser, mutation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Esiti: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::Almeno un controllo non è riuscito (${result})."
                exit 1
                ;;
            esac
          done

  deploy-test:
    name: Deploy test
    needs: [verify, gate]
    # I job browser e mutation saltati per il riuso non devono bloccare il deploy.
    # Gli esiti dei due gate restano obbligatori, anche dopo un fallimento o una cancellazione.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.gate.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.TEST_DEPLOY_ENABLED == 'true' && needs.verify.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    concurrency:
      group: deploy-test
      cancel-in-progress: false

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm

      # L'applicazione non viene ricompilata; Wrangler distribuisce la build verificata.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: build/
          run-id: ${{ needs.verify.outputs.artifact-run }}
          github-token: ${{ github.token }}

      - name: Verify artifact provenance
        run: node scripts/release.mjs verify --environment test

      - name: Check commit still on develop
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/develop | cut -f1)"
          test "${current_sha}" = "${VERIFIED_SHA}"

      - name: Restore receipt from previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs restore --environment test --receipt-prefix deployed

      - name: Deploy verified artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
        run: node scripts/release.mjs deploy --environment test --reviewed-migrations "${REVIEWED_MIGRATIONS}"

      - name: Check test endpoint
        run: curl --fail --silent --show-error --max-time 20 --output /dev/null https://test.fiscalbay.it/

      - name: Read Playwright version
        id: playwright
        if: needs.verify.outputs.e2e == 'true'
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"

      - name: Restore browser cache
        id: browsers
        if: needs.verify.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
          restore-keys: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-

      - name: Install browser for interaction tests
        if: needs.verify.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: needs.verify.outputs.e2e == 'true' && steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # L'account di collaudo torna a uno stato noto prima delle prove autenticate. Se il
      # ripristino non riesce (permessi del token, D1 non raggiungibile) le prove autenticate
      # vengono saltate con un avviso: il deploy non torna indietro per un problema del dato.
      - name: Reset test account
        id: account
        if: needs.verify.outputs.e2e == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          E2E_ACCOUNT_PASSWORD: ${{ secrets.E2E_ACCOUNT_PASSWORD }}
        run: node scripts/reset-test-account.mjs

      - name: Report test account warning
        if: needs.verify.outputs.e2e == 'true' && steps.account.outcome == 'failure'
        run: echo "::warning::Account di collaudo non ripristinato, prove autenticate saltate."

      - name: Check deployed browser interactions
        if: needs.verify.outputs.e2e == 'true'
        env:
          E2E_RUN_ID: test-smoke
          E2E_ACCOUNT_PASSWORD: ${{ steps.account.outcome == 'success' && secrets.E2E_ACCOUNT_PASSWORD || '' }}
        run: pnpm test:e2e:smoke

      - name: Check deployed pages
        if: needs.verify.outputs.e2e == 'true'
        env:
          E2E_RUN_ID: test-pages
          E2E_MATRIX: single
          E2E_BASE_URL: https://test.fiscalbay.it
          BROWSER_GREP: ${{ needs.verify.outputs.grep }}
          E2E_ACCOUNT_PASSWORD: ${{ steps.account.outcome == 'success' && secrets.E2E_ACCOUNT_PASSWORD || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # Le pagine sono già provate sullo stesso artefatto prima del merge: qui si visitano quelle
        # che provano ambiente, D1, sessione e segreti (@remote) e le aree toccate dalla modifica.
        # Le invocazioni del Worker restano nell'evidenza, ripulite, per le richieste lente o fallite.
        run: |
          grep="@remote"
          if [ "${BROWSER_GREP}" != "." ]; then grep="@remote|${BROWSER_GREP}"; fi
          node scripts/watch-invocations.mjs --worker fiscalbay-test \
            --output test-results/browser/invocations.json -- \
            node scripts/browser-tests.mjs --pages --grep "${grep}"

      # Un deploy con endpoint o interazioni falliti non resta distribuito sul test.
      - name: Roll back test deploy
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/release.mjs rollback --environment test

      - name: Upload deployed evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/browser/
            reports/release.json
          retention-days: 7
