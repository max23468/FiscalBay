name: React Doctor

on:
  pull_request:
    branches:
      - develop
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    name: react-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Stesse versioni del gate locale: nessun `latest` risolto a ogni run.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0

      - name: Select React checks
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-changes.mjs --base "${BASE_SHA}" --head "${HEAD_SHA}" --github-output

      - name: Read pinned versions
        if: steps.detect.outputs.doctor == 'true'
        id: versions
        run: |
          {
            echo "doctor=$(node -p 'require("./package.json").devDependencies["react-doctor"]')"
            echo "node=$(node -p 'require("./package.json").engines.node')"
          } >> "${GITHUB_OUTPUT}"

      - name: Scan
        if: steps.detect.outputs.doctor == 'true'
        uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2.2.9
        with:
          version: ${{ steps.versions.outputs.doctor }}
          node-version: ${{ steps.versions.outputs.node }}
          scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          blocking: warning
          comment: "false"
          review-comments: "true"
          commit-status: "false"
