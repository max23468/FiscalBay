# `workerd` scarica il binario della piattaforma ed `esbuild` i binding nativi:
# senza approvazione esplicita pnpm interrompe l'installazione.
allowBuilds:
  esbuild: true
  workerd: true
# `exceljs` dichiara `uuid` 8, con vulnerabilità nota; la 11 è compatibile.
overrides:
  uuid: 11.1.1
# Installa solo release pubblicate da almeno un giorno e rifiuta i pacchetti
# che perdono firme o provenance rispetto alle versioni precedenti.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Backport ufficiale della serie 6, pubblicato dopo le 7.x con provenance;
# arriva da Babel tramite `@react-router/dev`.
trustPolicyExclude:
  - semver@6.3.1
# Kysely 0.29 serializza le query SQLite con un lucchetto per isolate, che una richiesta
# annullata non rilascia più: D1 non ha connessioni da proteggere. Da rimuovere quando
# il dialetto D1 di Better Auth lo dichiara da sé.
patchedDependencies:
  "@better-auth/kysely-adapter@1.7.7": patches/@better-auth__kysely-adapter@1.7.7.patch
