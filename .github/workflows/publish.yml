name: Pubblica

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo del candidato approvato su main
        type: string
        required: true
      version:
        description: Versione 2.x presente nel changelog
        type: string
        required: true
      reviewed_migrations:
        description: Digest delle migration non additive approvate, se presenti
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualifica candidato
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          node scripts/release.mjs readiness
          node scripts/release-notes.mjs "${VERSION}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Read last published reference
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="$(gh release view --json tagName --jq .tagName 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          echo "ref=${base}" >> "${GITHUB_OUTPUT}"
      - name: Plan cumulative changes
        id: plan
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          base="${BASE_REF}"
          node scripts/classify-changes.mjs --base "${base}" --head HEAD --complete --github-output
          node scripts/classify-changes.mjs --base "${base}" --head HEAD --complete --json > /tmp/change-plan.log
      - name: Find verified source artifact
        id: reuse
        if: steps.plan.outputs.promotion-reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs
      - name: Download verified source artifact
        if: steps.reuse.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: build/
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Qualify source and all pages
        if: steps.reuse.outputs.run-id == ''
        env:
          E2E_RUN_ID: source-full
        run: pnpm verify:full
      - name: Qualify all pages on reused source artifact
        if: steps.reuse.outputs.run-id != ''
        env:
          E2E_PREBUILT: "1"
          E2E_MATRIX: full
          E2E_RUN_ID: source-full
        run: |
          node scripts/release.mjs verify --environment test
          node scripts/browser-tests.mjs --browsers chromium,webkit,firefox
      - name: Check critical mutations
        run: |
          targets="$(tail -1 /tmp/change-plan.log | node -e 'let input="";process.stdin.on("data",c=>input+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(input).mutation.join(" ")))')"
          if [ -n "${targets}" ]; then
            read -ra files <<< "${targets}"
            pnpm test:mutation "${files[@]}"
          fi
      - name: Build Production artifact
        env:
          CLOUDFLARE_ENV: production
        run: |
          pnpm build
      - name: Check Production artifact locally
        env:
          E2E_PRODUCTION: "1"
          E2E_PREBUILT: "1"
          E2E_MATRIX: full
          E2E_RUN_ID: production-local
        run: node scripts/browser-tests.mjs --pages --browsers chromium,webkit,firefox
      - name: Record Production provenance
        run: |
          node scripts/release.mjs manifest --environment production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ inputs.expected_sha }}
          path: build/
          include-hidden-files: true
          retention-days: 7
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  publish:
    name: Distribuisci e verifica
    needs: qualify
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ inputs.expected_sha }}
          path: build/
      - name: Deploy or resume confirmed deployment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
        run: node scripts/release.mjs deploy --environment production --expected-sha "${EXPECTED_SHA}" --reviewed-migrations "${REVIEWED_MIGRATIONS}"
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - name: Check Production public pages and preview exclusion
        env:
          E2E_BASE_URL: https://fiscalbay.it
          E2E_RUN_ID: production-remote
          E2E_PRODUCTION: "1"
          E2E_MATRIX: full
        run: node scripts/browser-tests.mjs --pages --browsers chromium,webkit,firefox
      - name: Rollback compatible deployment
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release.mjs rollback --environment production --expected-sha "${EXPECTED_SHA}"
      - name: Create immutable tag and release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release-notes.mjs "${VERSION}" --publish "${EXPECTED_SHA}"
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/release.json
            test-results/browser/
          retention-days: 30
