name: Pubblica

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: SHA completo del candidato approvato su main
        type: string
        required: true
      version:
        description: Versione 2.x presente nel changelog (facoltativa nella prova)
        type: string
        required: false
      reviewed_migrations:
        description: Digest delle migration non additive approvate, se presenti
        type: string
        required: false
      prova:
        description: Prova a vuoto, solo qualifica del candidato senza checkpoint né Production
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  plan:
    name: Verifica candidato e pianifica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mutation: ${{ steps.plan.outputs.mutation }}
      mutation-matrix: ${{ steps.plan.outputs.mutation-matrix }}
      promotion-reuse: ${{ steps.plan.outputs.promotion-reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
      - name: Check candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERSION: ${{ inputs.version }}
          PROVA: ${{ inputs.prova }}
        # La prova qualifica il candidato prima dei checkpoint: salta solo checkpoint e, senza
        # versione, il changelog; il job che distribuisce non parte.
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          if [ "${PROVA}" != true ]; then node scripts/release.mjs readiness; fi
          if [ "${PROVA}" != true ] || [ -n "${VERSION}" ]; then node scripts/release-notes.mjs "${VERSION}"; fi
      - name: Read last published reference
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base="$(gh release view --json tagName --jq .tagName 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          echo "ref=${base}" >> "${GITHUB_OUTPUT}"
      - name: Plan cumulative changes
        id: plan
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          base="${BASE_REF}"
          node scripts/classify-changes.mjs --base "${base}" --head HEAD --complete --github-output

  mutation:
    name: Mutation candidato
    needs: plan
    if: needs.plan.outputs.mutation != ''
    uses: ./.github/workflows/mutation.yml
    with:
      targets: ${{ needs.plan.outputs.mutation-matrix }}

  qualify:
    name: Qualifica candidato
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Find verified source artifact
        id: reuse
        if: needs.plan.outputs.promotion-reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs
      - name: Download verified source artifact
        if: steps.reuse.outputs.run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          path: build/
          run-id: ${{ steps.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Qualify source and all pages
        if: steps.reuse.outputs.run-id == ''
        env:
          E2E_RUN_ID: source-full
        run: pnpm verify:full
      - name: Qualify all pages on reused source artifact
        if: steps.reuse.outputs.run-id != ''
        env:
          E2E_PREBUILT: "1"
          E2E_MATRIX: full
          E2E_RUN_ID: source-full
        run: |
          node scripts/release.mjs verify --environment test
          node scripts/browser-tests.mjs --browsers chromium,webkit
      - name: Build Production artifact
        env:
          CLOUDFLARE_ENV: production
        run: |
          pnpm build
      - name: Check Production artifact locally
        env:
          E2E_PRODUCTION: "1"
          E2E_PREBUILT: "1"
          E2E_MATRIX: full
          E2E_RUN_ID: production-local
        run: node scripts/browser-tests.mjs --pages --browsers chromium,webkit
      - name: Record Production provenance
        run: |
          node scripts/release.mjs manifest --environment production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ inputs.expected_sha }}
          path: build/
          include-hidden-files: true
          retention-days: 7
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  publish:
    name: Distribuisci e verifica
    needs: [qualify, mutation]
    if: ${{ !inputs.prova && !cancelled() && needs.qualify.result == 'success' && (needs.mutation.result == 'success' || needs.mutation.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ inputs.expected_sha }}
          path: build/
      - name: Restore receipt from previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs restore --environment production --receipt-prefix release-receipt

      - name: Deploy or resume confirmed deployment
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}
        run: node scripts/release.mjs deploy --environment production --expected-sha "${EXPECTED_SHA}" --reviewed-migrations "${REVIEWED_MIGRATIONS}"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Check Production public pages and preview exclusion
        env:
          E2E_BASE_URL: https://fiscalbay.it
          E2E_RUN_ID: production-remote
          E2E_PRODUCTION: "1"
          E2E_MATRIX: full
        run: node scripts/browser-tests.mjs --pages --browsers chromium,webkit
      - name: Rollback compatible deployment
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release.mjs rollback --environment production --expected-sha "${EXPECTED_SHA}"
      - name: Create immutable tag and release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_PUBLISH_ENABLED: ${{ vars.PRODUCTION_PUBLISH_ENABLED }}
          OWNER_APPROVED_SHA: ${{ vars.OWNER_APPROVED_SHA }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release-notes.mjs "${VERSION}" --publish "${EXPECTED_SHA}"
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/release.json
            test-results/browser/
          retention-days: 30
