name: Mutation

on:
  workflow_call:
    inputs:
      targets:
        description: Matrice JSON dei moduli critici da qualificare
        type: string
        required: true
      fail-fast:
        description: Annulla gli altri moduli al primo fallimento
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  mutation:
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      # Nelle PR un modulo fallito annulla gli altri; il candidato conserva le ricevute riuscite.
      fail-fast: ${{ inputs.fail-fast }}
      max-parallel: 8
      matrix: ${{ fromJSON(inputs.targets) }}
    concurrency:
      group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    env:
      MUTATION_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Find verified mutation receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/mutation.mjs --find "${MUTATION_TARGET}"
      - name: Download verified receipt
        if: steps.receipt.outputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: ${{ steps.receipt.outputs.directory }}
          run-id: ${{ steps.receipt.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Check receipt inputs and outcome
        if: steps.receipt.outputs.run-id != ''
        run: node scripts/mutation.mjs --check "${MUTATION_TARGET}"
      - name: Restore incremental results
        if: steps.receipt.outputs.run-id == '' && steps.receipt.outputs.reusable == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.receipt.outputs.directory }}/incremental.json
            ${{ steps.receipt.outputs.directory }}/context.json
          key: ${{ steps.receipt.outputs.cache-key }}
          restore-keys: ${{ steps.receipt.outputs.cache-prefix }}
      - name: Install dependencies
        if: steps.receipt.outputs.run-id == ''
        run: pnpm install --frozen-lockfile
      - name: Qualify critical module
        if: steps.receipt.outputs.run-id == ''
        env:
          MUTATION_INCREMENTAL: "1"
        run: pnpm test:mutation "${MUTATION_TARGET}"
      # Gli intervalli di una PR non certificano il modulo intero.
      - name: Preserve verified receipt
        if: success() && steps.receipt.outputs.run-id == '' && steps.receipt.outputs.reusable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.receipt.outputs.artifact }}
          path: |
            ${{ steps.receipt.outputs.directory }}/receipt.json
            ${{ steps.receipt.outputs.directory }}/mutation.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve mutation evidence
        if: always() && steps.receipt.outputs.run-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.receipt.outputs.cache-key }}
          path: ${{ steps.receipt.outputs.directory }}
          retention-days: 7
