name: Node e pnpm
description: Node da `engines.node` e pnpm da `packageManager` di package.json, con le dipendenze del lockfile.

inputs:
  install:
    description: Installa le dipendenze con il lockfile congelato
    default: "true"

runs:
  using: composite
  steps:
    # Senza `version` l'Action legge `packageManager`: nessuna versione scritta a mano nei workflow.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
