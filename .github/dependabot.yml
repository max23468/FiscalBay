# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Limiti piu' alti + raggruppamento per evitare starvation: con limite basso i
# pochi slot venivano occupati da PR non mergiate e gli altri update non
# ottenevano mai una PR (es. #115 rimasta aperta per settimane).
# Le PR idonee vengono chiuse in auto-merge dopo CI verde
# (.github/workflows/dependabot-auto-merge.yml), quindi la coda non si accumula.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    labels:
      - dependencies
      - javascript
    ignore:
      # Con queste versioni Stryker termina il worker della suite Cloudflare nel dry-run e
      # nessuna mutation produce un report.
      - dependency-name: "vitest"
        versions: ["5.0.4", "5.0.5"]
      - dependency-name: "@vitest/*"
        versions: ["5.0.4", "5.0.5"]
    groups:
      # Runner dei test e della mutation in una PR propria, fuori dal merge automatico: si
      # accetta soltanto dopo una mutation riuscita su un modulo della suite Cloudflare.
      test-runner:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@stryker-mutator/*"
          - "@cloudflare/vitest-plugin"
      # Un'unica PR per tutti gli altri minor/patch (auto-merge dopo CI). I major restano
      # PR singole: quelli runtime hanno review manuale.
      javascript-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # Le Action composite del repository dichiarano anch'esse Action esterne.
    directories:
      - /
      - /.github/actions/*
    target-branch: develop
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Rome
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      # Un'unica PR per tutte le Action (anche major): basso rischio e gated
      # dalla CI, quindi in auto-merge.
      github-actions:
        patterns:
          - "*"
