name: Mutation

# Campagna settimanale su `develop` e avvio manuale; la qualifica del candidato la richiama per i
# moduli critici del diff cumulativo. Su `develop` ogni parte riuscita salva il riferimento da cui
# la CI delle PR prova i moduli in modo incrementale.
on:
  # Pianificazione e avvio manuale leggono il workflow dal branch predefinito, `develop`.
  schedule:
    # Lunedì 03:17 UTC: fuori dagli orari di lavoro e lontano dall'inizio dell'ora.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: Moduli critici separati da spazi; vuoto per tutti
        type: string
        required: false
  workflow_call:
    inputs:
      expected_sha:
        type: string
        default: ""
      targets:
        description: Matrice JSON dei moduli critici da qualificare
        type: string
        required: true

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read
  actions: read

jobs:
  select:
    name: Select modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      parallel: ${{ steps.targets.outputs.parallel }}
    steps:
      # La pianificazione parte dal branch predefinito: la campagna prova `develop`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || (github.event_name == 'schedule' && 'develop' || '') }}
          persist-credentials: false
      # L'instrumenter di Stryker conta i mutanti di ogni modulo per dividerlo in parti.
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-timings.json
          key: mutation-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-timings-
      - name: List critical modules
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          GH_TOKEN: ${{ github.token }}
          # Soltanto la qualifica del candidato richiama il workflow con il commit atteso.
          MUTATION_QUALIFICATION: ${{ inputs.expected_sha != '' }}
          MUTATION_CAMPAIGN: ${{ github.event.schedule == '17 3 * * 1' || github.event.schedule == '23 3 * * 1' }}
        run: node scripts/mutation.mjs --matrix "${TARGETS}"

  mutation:
    name: ${{ matrix.target }} ${{ matrix.shard }}
    needs: select
    runs-on: ubuntu-26.04
    # Una parte prova al più circa 150 mutanti: un quarto d'ora, con ampio margine.
    timeout-minutes: 60
    strategy:
      # Ogni modulo conclude la propria prova: un fallimento non nasconde gli altri esiti.
      fail-fast: false
      # Con PR o cicli attivi le sole campagne lasciano spazio ai job che sbloccano il deploy.
      max-parallel: ${{ fromJSON(needs.select.outputs.parallel) }}
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      MUTATION_TARGET: ${{ matrix.target }}
      MUTATION_SHARD: ${{ matrix.shard }}
      MUTATION_RANGES: ${{ matrix.ranges }}
      MUTATION_DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || (github.event_name == 'schedule' && 'develop' || '') }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # La qualifica del candidato parte dal riferimento di `develop`, come le PR: Stryker ripete
      # soltanto i mutanti con codice o test cambiati. La campagna settimanale resta completa.
      - name: Restore develop reference
        if: inputs.expected_sha != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-reference
          key: mutation-reference-${{ matrix.target }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            mutation-reference-${{ matrix.target }}-${{ matrix.shard }}-
            mutation-reference-${{ matrix.target }}-
      - name: Qualify critical module
        env:
          MUTATION_INCREMENTAL_BASE: ${{ inputs.expected_sha != '' && '.mutation-reference/incremental.json' || '' }}
        run: pnpm test:mutation "${MUTATION_TARGET}"
      # Soltanto una parte senza superstiti: un esito sopravvissuto nel riferimento si ripeterebbe
      # in ogni PR che tocca il modulo. Le chiavi sono immutabili: la run le distingue.
      - name: Keep develop reference
        if: success() && github.ref == 'refs/heads/develop'
        run: |
          mkdir -p .mutation-reference
          cp reports/mutation/*/incremental.json .mutation-reference/incremental.json
      - name: Save develop reference
        if: success() && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-reference
          key: mutation-reference-${{ matrix.target }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # Anche con un modulo fallito: misure e riferimenti entrano soltanto per i moduli con tutte le
  # parti riuscite, gli altri restano quelli precedenti.
  timings:
    name: Preserve measured durations
    needs: mutation
    if: ${{ !cancelled() && needs.mutation.result != 'skipped' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Il codice della raccolta è quello della run su `develop`: le misure portano già digest e
    # righe del sorgente provato, e decidono soltanto come dividere le parti, mai cosa provare.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-timings.json
          key: mutation-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-timings-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: reports/mutation-timings/
      - run: node scripts/mutation.mjs --collect-timings reports/mutation-timings
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-timings.json
          key: mutation-timings-${{ github.run_id }}-${{ github.run_attempt }}
      # Il riferimento completo di ogni modulo, riunito dalle sue parti, permette alla PR di
      # provarlo in un solo job: le chiavi sono immutabili e la PR legge la più recente.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-references
          key: mutation-references-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-references-
      - run: node scripts/mutation.mjs --collect-references reports/mutation-timings
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mutation-references
          key: mutation-references-${{ github.run_id }}-${{ github.run_attempt }}
