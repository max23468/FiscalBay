<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FiscalBay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffdf9;
        --text: #0e3372;
        --muted: #4a5d70;
        --link: #1a4fa6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --text: #fffdf9;
          --muted: #b8c4d0;
          --link: #4f87e3;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 1.5rem;
      }
      h1 img {
        display: block;
        width: min(17.5rem, 100%);
        height: auto;
        margin: 0 auto;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <picture>
          <source srcset="/fiscalbay-logo-dark.svg" media="(prefers-color-scheme: dark)" />
          <img src="/fiscalbay-logo.svg" alt="FiscalBay" />
        </picture>
      </h1>
      <p>La nuova versione di FiscalBay è in preparazione.</p>
      <p lang="en">The new version of FiscalBay is being prepared.</p>
      <p>
        Assistenza · Support:
        <a href="mailto:supporto@fiscalbay.it">supporto@fiscalbay.it</a>
      </p>
    </main>
  </body>
</html>
