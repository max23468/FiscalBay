name: Qualifica candidato

on:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      mutation_targets:
        type: string
        required: true
      source_reuse:
        type: boolean
        default: false
    outputs:
      artifact:
        value: ${{ jobs.certify.outputs.artifact }}
      artifact-run:
        value: ${{ jobs.certify.outputs.artifact-run }}

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.reuse.outputs.run-id }}
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check expected commit and tree
        id: tree
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"
      - name: Find qualified Production candidate
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs --candidate

  source:
    needs: select
    if: needs.select.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.reuse.outputs.artifact || format('source-{0}-{1}', github.run_id, github.run_attempt) }}
      artifact-run: ${{ steps.reuse.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - name: Find verified source
        id: reuse
        if: inputs.source_reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs
      - run: pnpm install --frozen-lockfile
        if: steps.reuse.outputs.run-id == ''
      - name: Qualify source
        if: steps.reuse.outputs.run-id == ''
        run: pnpm verify
      - name: Record source provenance
        if: steps.reuse.outputs.run-id == ''
        run: node scripts/release.mjs manifest --environment test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.run-id == ''
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    needs: select
    if: needs.select.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:live
      - run: node scripts/release.mjs manifest --environment production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: [select, source, production]
    if: needs.select.outputs.run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [source, production]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.kind == 'source' && needs.source.outputs.artifact || needs.production.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ matrix.kind == 'source' && needs.source.outputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify provenance
        env:
          KIND: ${{ matrix.kind }}
        run: |
          environment="test"
          if [ "${KIND}" = production ]; then environment="production"; fi
          node scripts/release.mjs verify --environment "${environment}"
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - run: pnpm exec playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Qualify all selected pages and interactions
        env:
          E2E_PREBUILT: "1"
          E2E_MATRIX: full
          E2E_RUN_ID: ${{ matrix.kind }}-${{ matrix.shard }}
          E2E_PRODUCTION: ${{ matrix.kind == 'production' && '1' || '' }}
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          pages=()
          if [ "${KIND}" = production ]; then pages=(--pages); fi
          node scripts/browser-tests.mjs "${pages[@]}" --browsers chromium,webkit --shard "${SHARD}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kind }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  mutation:
    name: Mutation
    needs: select
    if: needs.select.outputs.run-id == '' && inputs.mutation_targets != '{"target":[]}'
    uses: ./.github/workflows/mutation.yml
    with:
      targets: ${{ inputs.mutation_targets }}

  certify:
    name: Candidate qualified
    needs: [select, source, production, browser, mutation]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.select.outputs.run-id != '' || (needs.source.result == 'success' && needs.production.result == 'success' && needs.browser.result == 'success' && (needs.mutation.result == 'success' || needs.mutation.result == 'skipped'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: candidate-${{ needs.select.outputs.tree }}
      artifact-run: ${{ needs.select.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.11.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.run-id != '' && format('candidate-{0}', needs.select.outputs.tree) || needs.production.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ needs.select.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release.mjs verify --environment production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.select.outputs.run-id == ''
        with:
          pattern: candidate-browser-${{ github.run_id }}-*
          path: test-results/candidate/
      - name: Check complete browser evidence
        if: needs.select.outputs.run-id == ''
        run: node scripts/browser-tests.mjs --check-evidence test-results/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.select.outputs.run-id == ''
        with:
          name: candidate-${{ needs.select.outputs.tree }}
          overwrite: true
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
