name: Actionlint

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: actionlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          reporter: github-check
          fail_level: error
