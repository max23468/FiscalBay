<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FiscalBay</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fffdf9;
        --text: #16324f;
        --muted: #4a5d70;
        --link: #1f6fa8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f2236;
          --text: #fffdf9;
          --muted: #b8c4d0;
          --link: #7cc4f0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1rem;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--link);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>FiscalBay</h1>
      <p>La nuova versione di FiscalBay è in preparazione.</p>
      <p lang="en">The new version of FiscalBay is being prepared.</p>
      <p>
        Assistenza · Support:
        <a href="mailto:supporto@fiscalbay.it">supporto@fiscalbay.it</a>
      </p>
    </main>
  </body>
</html>
