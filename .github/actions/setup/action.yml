name: Node e pnpm
description: Workspace attendibile per Git, Node da `engines.node` e pnpm da `packageManager` di package.json, con le dipendenze del lockfile.

inputs:
  install:
    description: Installa le dipendenze con il lockfile congelato
    default: "true"

runs:
  using: composite
  steps:
    # Nel container di Playwright l'utente non possiede il workspace montato: senza questa
    # eccezione Git rifiuta il repository. Sul runner non cambia nulla.
    # Sul runner del Mac la configurazione globale è quella dell'owner: lì non serve e non si tocca.
    - if: runner.os == 'Linux'
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Senza `version` l'Action legge `packageManager`: nessuna versione scritta a mano nei workflow.
    # Il coordinatore sul Mac non installa dipendenze e non lascia pnpm nella home dell'owner.
    - if: inputs.install == 'true' || runner.os == 'Linux'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
