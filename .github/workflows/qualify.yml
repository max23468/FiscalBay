name: Qualifica candidato

on:
  workflow_call:
    inputs:
      expected_sha:
        type: string
        required: true
      # `full` certifica il tree del candidato; `production` prepara e prova la sola build
      # Production della pubblicazione, con il giorno della versione.
      scope:
        type: string
        default: full
      mutation_targets:
        type: string
        default: '{"target":[]}'
      skip_pages:
        description: Tag delle visite riusate dall'ultima qualifica completa delle pagine
        type: string
        default: ""
      day:
        description: Giorno della versione, nella sola build che si distribuisce
        type: string
        default: ""
      force_full:
        type: boolean
        default: false
    outputs:
      artifact:
        value: ${{ jobs.certify.outputs.artifact }}
      artifact-run:
        value: ${{ jobs.certify.outputs.artifact-run }}

env:
  DO_NOT_TRACK: "1"

# Anche nel container di Playwright, dove la shell predefinita dei passi sarebbe `sh`.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run-id: ${{ steps.reuse.outputs.run-id }}
      tree: ${{ steps.tree.outputs.tree }}
      playwright: ${{ steps.tree.outputs.playwright }}
    steps:
      # Nessun `ref`: si qualifica soltanto il commit della run, confrontato con quello atteso.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check expected commit and tree
        id: tree
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          {
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "playwright=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')"
          } >> "${GITHUB_OUTPUT}"
      - name: Find qualified Production candidate
        id: reuse
        if: inputs.scope == 'full' && !inputs.force_full
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs --candidate

  source:
    needs: select
    if: inputs.scope == 'full' && needs.select.outputs.run-id == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.reuse.outputs.artifact || format('source-{0}-{1}', github.run_id, github.run_attempt) }}
      artifact-run: ${{ steps.reuse.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Come in `select`, la ricerca usa il Node del runner: installazione e cache servono
      # soltanto senza una sorgente già verificata.
      - name: Find verified source
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: node scripts/find-build.mjs
      - uses: ./.github/actions/setup
        if: steps.reuse.outputs.run-id == ''
      - name: Qualify source
        if: steps.reuse.outputs.run-id == ''
        run: pnpm verify
      - name: Preserve coverage report
        if: always() && steps.reuse.outputs.run-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record source provenance
        if: steps.reuse.outputs.run-id == ''
        run: node scripts/release/release.mjs manifest --environment test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.reuse.outputs.run-id == ''
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  production:
    needs: select
    if: needs.select.outputs.run-id == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact: production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build:live
        env:
          VITE_RELEASE_DAY: ${{ inputs.day }}
      - run: node scripts/release/release.mjs manifest --environment production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Browser e librerie di sistema dall'immagine ufficiale della versione di Playwright del manifest.
  browser:
    needs: [select, source, production]
    if: ${{ !cancelled() && inputs.scope == 'full' && needs.select.result == 'success' && needs.production.result == 'success' && needs.source.result != 'failure' && needs.select.outputs.run-id == '' }}
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.select.outputs.playwright }}-noble
      options: --ipc=host
    # La sorgente prova tutto in otto partizioni. La build Production, senza dati di prova, apre
    # una volta le pagine pubbliche: la sua configurazione non dipende da lingua, tema o larghezza.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [source, production]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - { kind: production, shard: 2 }
          - { kind: production, shard: 3 }
          - { kind: production, shard: 4 }
          - { kind: production, shard: 5 }
          - { kind: production, shard: 6 }
          - { kind: production, shard: 7 }
          - { kind: production, shard: 8 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.kind == 'source' && needs.source.outputs.artifact || needs.production.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ matrix.kind == 'source' && needs.source.outputs.artifact-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify provenance
        env:
          KIND: ${{ matrix.kind }}
        run: |
          environment="test"
          if [ "${KIND}" = production ]; then environment="production"; fi
          node scripts/release/release.mjs verify --environment "${environment}"
      - name: Qualify all selected pages and interactions
        env:
          E2E_PREBUILT: "1"
          E2E_MATRIX: ${{ matrix.kind == 'source' && 'full' || 'single' }}
          # Come in ogni altra fase, una prova che riesce alla ripetizione resta segnalata.
          E2E_RETRIES: "1"
          E2E_RUN_ID: ${{ matrix.kind }}-${{ matrix.shard }}
          E2E_PRODUCTION: ${{ matrix.kind == 'production' && '1' || '' }}
          VITE_RELEASE_DAY: ${{ inputs.day }}
          KIND: ${{ matrix.kind }}
          SHARD: ${{ matrix.shard }}/${{ matrix.kind == 'source' && 8 || 1 }}
          SKIP_PAGES: ${{ inputs.skip_pages }}
        run: |
          selection=()
          if [ "${KIND}" = production ]; then selection=(--pages); fi
          if [ -n "${SKIP_PAGES}" ]; then
            selection+=(--grep-invert "${SKIP_PAGES}")
          fi
          node scripts/browser-tests.mjs "${selection[@]}" --browsers chromium,webkit --shard "${SHARD}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.kind }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  mutation:
    name: Mutation
    needs: select
    if: inputs.scope == 'full' && needs.select.outputs.run-id == '' && inputs.mutation_targets != '{"target":[]}'
    uses: ./.github/workflows/mutation.yml
    with:
      targets: ${{ inputs.mutation_targets }}
      expected_sha: ${{ inputs.expected_sha }}

  certify:
    name: Candidate qualified
    needs: [select, source, production, browser, mutation]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.select.outputs.run-id != '' || ((needs.source.result == 'success' || needs.source.result == 'skipped') && needs.production.result == 'success' && (needs.browser.result == 'success' || inputs.scope != 'full') && (needs.mutation.result == 'success' || needs.mutation.result == 'skipped'))) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      artifact: ${{ inputs.scope == 'full' && format('candidate-{0}', needs.select.outputs.tree) || needs.production.outputs.artifact }}
      artifact-run: ${{ needs.select.outputs.run-id || github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: ${{ needs.select.outputs.run-id == '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.select.outputs.run-id != '' && format('candidate-{0}', needs.select.outputs.tree) || needs.production.outputs.artifact }}
          path: .cloudflare/output/
          run-id: ${{ needs.select.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release/release.mjs verify --environment production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.scope == 'full' && needs.select.outputs.run-id == ''
        with:
          pattern: candidate-browser-${{ github.run_id }}-*
          path: test-results/candidate/
      - name: Check complete browser evidence
        if: inputs.scope == 'full' && needs.select.outputs.run-id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SKIP_PAGES: ${{ inputs.skip_pages }}
          VITE_RELEASE_DAY: ${{ inputs.day }}
        run: node scripts/browser-tests.mjs --check-evidence test-results/candidate --grep-invert "${SKIP_PAGES}"
      - name: Preserve unstable tests
        if: inputs.scope == 'full' && needs.select.outputs.run-id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-tests
          overwrite: true
          path: test-results/candidate/flaky.json
          retention-days: 14
      - name: Record page coverage and dependencies
        if: inputs.scope == 'full' && needs.select.outputs.run-id == '' && inputs.skip_pages == ''
        run: node scripts/pages-reuse.mjs --record test-results/candidate/pages-full.json
      # Senza visite riusate il tree diventa la base del riuso delle pagine per i sette giorni in
      # cui l'artefatto resta: almeno una volta alla settimana la matrice gira per intero.
      - name: Mark complete page qualification
        if: inputs.scope == 'full' && needs.select.outputs.run-id == '' && inputs.skip_pages == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-full
          overwrite: true
          path: test-results/candidate/pages-full.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.scope == 'full' && needs.select.outputs.run-id == ''
        with:
          name: candidate-${{ needs.select.outputs.tree }}
          overwrite: true
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
